info.app.name=Product Management My Portfolio
info.app.description=A general purpose product management system with CRUD and authentication capabilities.
info.app.version=1.0.0

spring.application.name=spring-web

mybatis.mapper-locations=classpath:mapper/*.xml

spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.test.context.jdbc=DEBUG

server.port=${PORT:10000}

# DB設定
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none