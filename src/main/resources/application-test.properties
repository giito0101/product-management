info.app.name=Product Management My Portfolio
info.app.description=A general purpose product management system with CRUD and authentication capabilities.
info.app.version=1.0.0

## Server Properties
server.port= 1500

## H2 Database settings
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driverClassname=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.initialization-mode=always
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.globally_quoted_identifiers=true

logging.level.org.springframework.test.context.jdbc=DEBUG