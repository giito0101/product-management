###### 03-spring-boot-hibernate-jpa-crud ######
spring.datasource.url=jdbc:mysql://localhost:3306/student_data
spring.datasource.username=springdemo
spring.datasource.password=springdemo

# スプリングバナーの削除
spring.main.banner-mode.=off

# ログレベル出力を減らす。ログレベルはwarn
logging.level.root=warn

# SQLステートメントを表示するためにログの追加を設定する
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# JPA/Hibernateを自動化するための構成のテーブル作成
# "update"設定はテーブルでデータを保つでしょう
#spring.jpa.hibernate.ddl-auto=update

#
# Simple Spring Security
#
spring.security.user.name=scott
spring.security.user.password=test123