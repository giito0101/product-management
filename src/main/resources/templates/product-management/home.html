<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Daisuke Itoga">
    <title>商品管理システム試作品 - ホーム画面</title>
    <div th:replace="product-management/fragments/head.html"></div>
    <link th:href="@{/css/product-management/dashboard.css}" rel="stylesheet">
</head>

<body>
    <div th:replace="product-management/fragments/symbols :: symbols"></div>

    <div th:replace="product-management/fragments/header.html"></div>
    
    <div class="container-1 d-flex">
        <div th:replace="product-management/fragments/dashboard.html">
        </div>
        <main class="container-fluid col-md-10 justify-content-center mt-4">
            <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center align-items-lg-start">
                <div
                    class="d-flex flex-lg-column col-12 col-lg-2 align-items-center flex-row justify-content-center align-items-center">
                    <div class="rounded-container p-4 bg-skyblue text-center col-5 col-lg-12 me-4 me-lg-0 mb-4">
                        <h5>総在庫数</h5>
                        <h1 th:text="${countProductsMessage}"></h1>
                    </div>
                    <div class="rounded-container p-4 bg-skyblue text-center col-5 col-lg-12 mb-4 mb-lg-0">
                        <h5>売り切れ商品</h5>
                        <h1 th:text="${countOutOfStockProductsMessage}"></h1>
                    </div>
                </div>
                <div class="rounded-container p-sm-4 p-0 col-11 col-lg-9 flex-column ms-lg-4 ms-0">
                    <h2 class="mb-5 d-flex align-items-center">
                        <svg class="bi-big me-2">
                            <use xlink:href="#refresh" />
                        </svg>
                        最近追加/更新された商品のリスト
                    </h2>
                    <div class="table-responsive small rounded-table">
                        <table class="table table-striped table-sm">
                            <thead>
                                <tr>
                                    <th scope="col"></th>
                                    <th scope="col">商品名</th>
                                    <th scope="col">カテゴリ</th>
                                    <th scope="col">変更数</th>
                                    <th scope="col">更新日時</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="lateststockHistory : ${lateststockHistoreis}">
                                    <td>
                                        <span class="badge text-bg-success rounded-pill badge-custom" th:text="${lateststockHistory.stockStatus}"></span>
                                    </td>
                                    <td th:text="${lateststockHistory.productName}"></td>
                                    <td th:text="${lateststockHistory.categoryName}"></td>
                                    <td th:text="${lateststockHistory.changeQuantity}"></td>
                                    <td th:text="${lateststockHistory.formattedLatestTimestamp}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:src="@{/js/badge_transform.js}" defer></script>
</body>

</html>
