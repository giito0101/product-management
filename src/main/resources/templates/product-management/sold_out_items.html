<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Daisuke Itoga">
    <title>商品管理システム試作品 - 売り切れ商品画面</title>
    <div th:replace="product-management/fragments/head.html"></div>
    <link th:href="@{/css/product-management/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/product-management/list.css}" rel="stylesheet">
</head>

<body>
    <!-- モーダルの定義 -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">確認</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                </div>
                <div class="modal-body">
                    商品を削除しますが、よろしいですか？
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <a id="confirmDeleteButton" class="btn btn-danger" href="#">削除する</a>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="product-management/fragments/symbols :: symbols"></div>

    <div th:replace="product-management/fragments/header.html"></div>

    <div class="container-1 d-flex">
        <div th:replace="product-management/fragments/dashboard.html">
        </div>
        <main class="container-fluid col-md-10 justify-content-center my-4">
            <div class="d-flex flex-column justify-content-center align-items-center">
                <div class="rounded-container p-sm-4 p-0 col-11 flex-column">
	                <h2 class="mb-3 d-flex align-items-center" th:if="${isUserDelete}">
	                    <span class="badge bg-success mb-3">削除が完了しました</span>
	                </h2>
                    <h2 class="mb-3 d-flex align-items-center">
	                    <svg class="bi-big">
	                        <use xlink:href="#bi-bag" />
	                    </svg>
                        売り切れ商品
                    </h2>
                    <form class="search row" role="search" th:action="@{/product/searchItems}" method="post" th:object="${productSearchForm}">
					    <!-- hidden フィールド -->
					    <input type="hidden" name="direction" th:value="${direction}" />
					    <input type="hidden" name="sortBy" th:value="${sortBy}" />
					    <input type="hidden" name="stockType" th:value="sold_out_items" />
					
					    <!-- エラー表示 -->
					    <span th:if="${#fields.hasErrors('search')}" th:errors="*{search}" class="text-danger"></span>
					    <span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="text-danger"></span>
					    <span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="text-danger"></span>
					    <span th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="text-danger"></span>
                        <div class="d-flex flex-md-row flex-column mb-3 search align-items-center">
	                        <div class="col-md-8 col-12 mb-3 mb-md-0">
	                            <input class="form-control-sm me-3 col-10 col-md-9  col-xl-8 rounded" type="search"
	                                placeholder="商品名、カテゴリをフィルタリング" aria-label=".form-control-sm Search" th:field="*{search}">
	                            <button class="rounded bg-light col-2 col-md-3 col-xl-4" type="submit">
	                                <svg class="bi-search">
	                                    <use xlink:href="#search" />
	                                </svg>
	                            </button>
	                        </div>
	                        <div class="col-12 col-md-4 d-flex flex-xl-row flex-column">
	                            <div class="col-xl-5 col-12">
	                                <input type="date" class="form-control" th:field="*{startDate}">
	                            </div>
	                            <div class="mx-1" style="color:#ddd">
	                                〜
	                            </div>
	                            <div class="col-xl-5 col-12">
	                                <input type="date" class="form-control" th:field="*{endDate}">
	                            </div>
	                        </div>
	                    </div>
                    </form>
                    <div class="mb-3">
                        <button type="submit" class="me-3 btn btn-outline-secondary" th:href="@{/product/csv(sortBy=${sortBy}, direction=${direction}, fileType='sold_out_items')}" onclick="location.href=this.getAttribute('href')">CSV</button>
                        <button type="submit" class="btn btn-outline-secondary"  th:href="@{/product/excel(sortBy=${sortBy}, direction=${direction}, fileType='sold_out_items')}" onclick="location.href=this.getAttribute('href')">Excel</button>
                    </div>
                    <div class="table-responsive rounded-table">
                        <table class="table table-striped table-sm">
                            <thead>
                                <tr>
                                    <th scope="col"></th>
                                    <th scope="col">
                                        <a th:href="@{/product/soldOutItems(sortBy='name', direction=${sortBy == 'name' && direction == 'asc' ? 'desc' : 'asc'})}"
                                            class="link-primary text-decoration-none">
                                            商品名
                                            <span th:if="${sortBy == 'name'}"
                                                th:text="${direction == 'asc' ? '▲' : '▼'}"></span>
                                        </a>
                                    </th>
                                    <th scope="col">
                                        <a th:href="@{/product/soldOutItems(sortBy='category', direction=${sortBy == 'category' && direction == 'asc' ? 'desc' : 'asc'})}"
                                            class="link-primary text-decoration-none">
                                            カテゴリ
                                            <span th:if="${sortBy == 'category'}"
                                                th:text="${direction == 'asc' ? '▲' : '▼'}"></span>
                                        </a>
                                    </th>
                                    <th scope="col">
                                        <a th:href="@{/product/soldOutItems(sortBy='stock', direction=${sortBy == 'stock' && direction == 'asc' ? 'desc' : 'asc'})}"
                                            class="link-primary text-decoration-none">
                                            在庫数
                                            <span th:if="${sortBy == 'stock'}"
                                                th:text="${direction == 'asc' ? '▲' : '▼'}"></span>
                                        </a>
                                    </th>
                                    <th scope="col">
                                        <a th:href="@{/product/soldOutItems(sortBy='price', direction=${sortBy == 'price' && direction == 'asc' ? 'desc' : 'asc'})}"
                                            class="link-primary text-decoration-none">
                                            価格
                                            <span th:if="${sortBy == 'price'}"
                                                th:text="${direction == 'asc' ? '▲' : '▼'}"></span>
                                        </a>
                                    </th>
                                    <th scope="col"></th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="productWithStatus : ${productsWithStatus}">
                                    <td>
                                        <span class="badge text-bg-success rounded-pill badge-custom"
                                            th:text="${productWithStatus.stockStatus}">在庫有り</span>
                                    </td>
                                    <td th:text="${productWithStatus.name}"></td>
                                    <td th:text="${productWithStatus.categoryName}"></td>
                                    <td th:text="${productWithStatus.stock}"></td>
                                    <td th:text="${productWithStatus.price}" data-price="true"></td>
                                    <td>
                                        <a th:href="@{/product/edit(productId=${productWithStatus.id})}">
                                            <svg class="bi">
                                                <use xlink:href="#edit" />
                                            </svg>
                                        </a>
                                    </td>
                                    <td>
										<a th:href="@{/product/delete(productId=${productWithStatus.id}, path=sold_out)}" class="delete-link">
										    <svg class="bi">
										        <use xlink:href="#delete" />
										    </svg>
										</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- スクリプトの読み込み -->
    <script th:src="@{/js/badge_transform.js}" defer></script>
    <script th:src="@{/js/format_number.js}" defer></script>
    <script th:src="@{/js/modal.js}" defer></script>
</body>

</html>
