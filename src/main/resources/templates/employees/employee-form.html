<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	
	<title>Save Employee<title>
		
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>bootstrap demo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	
</head>
<body>
	<div class="container">
		
		<h3>Employee Directory</h3>
		<hr>
		
		<p class="h4 mb4">Save Employee</p>
		
		<form action="#" th:action="@{/employees/save}"
		                 th:object="${employee}" method="POST">
		                 
			<!-- Add hidden form field to handle the update -->
			<input type="hidden" th:field="*{id}">
			
			<input type="text" th:field="*{firstName}"
			       class="form-control mb-4 w-25" placeholder="First name">
			
			<input type="text" th:field="*{lastName}"
			       class="form-control mb-4 w-25" placeholder="Last name">

			<input type="text" th:field="*{email}"
			       class="form-control mb-4 w-25" placeholder="Email name">
			
			<button type="submit" class="btn btn-info col-2">Save</button>

</body>
</html>
